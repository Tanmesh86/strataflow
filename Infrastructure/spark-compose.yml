services:
  spark:
    image: apache/spark:4.0.0
    container_name: pulseflow-spark
    command: /bin/bash -c "while true; do sleep 3600; done"
    ports:
      - "4040:4040"

    volumes:
      - ../Spark:/opt/pulseflow/Spark
      - ../data:/opt/pulseflow/data
      - ../checkpoints:/opt/pulseflow/checkpoints
      - ./spark-defaults.conf:/opt/spark/conf/spark-defaults.conf:ro
      - ${USERPROFILE}/.aws/credentials:/tmp/aws-credentials:ro

    environment:
      - AWS_SHARED_CREDENTIALS_FILE=/tmp/aws-credentials
      - AWS_DEFAULT_REGION=ap-south-1
      - AWS_REGION=ap-south-1

    networks:
      - infrastructure_default

networks:
  infrastructure_default:
    external: true