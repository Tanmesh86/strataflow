services:

  kafka:
    image: apache/kafka:latest
    container_name: pulseflow-kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0

  connect:
    image: debezium/connect:3.0.0.Final
    container_name: pulseflow-connect
    depends_on:
      - kafka
    ports:
      - "8083:8083"
    environment:
      BOOTSTRAP_SERVERS: kafka:9092
      GROUP_ID: 1
      CONFIG_STORAGE_TOPIC: connect_configs
      OFFSET_STORAGE_TOPIC: connect_offsets
      STATUS_STORAGE_TOPIC: connect_statuses
      KEY_CONVERTER: org.apache.kafka.connect.json.JsonConverter
      VALUE_CONVERTER: org.apache.kafka.connect.json.JsonConverter
      KEY_CONVERTER_SCHEMAS_ENABLE: "false"
      VALUE_CONVERTER_SCHEMAS_ENABLE: "false"

  spark:
    build:
      context: .
      dockerfile: Dockerfile.spark
    container_name: pulseflow-spark
    volumes:
      - ../Spark:/opt/pulseflow/Spark
      - ../data:/opt/pulseflow/data
      - ../checkpoints:/opt/pulseflow/checkpoints
      - ${USERPROFILE}/.aws:/home/spark/.aws:ro
    environment:
      HOME: /home/spark
      AWS_PROFILE: default
      AWS_CONFIG_FILE: /home/spark/.aws/config
      AWS_SHARED_CREDENTIALS_FILE: /home/spark/.aws/credentials
    command: /bin/bash -c "while true; do sleep 3600; done"