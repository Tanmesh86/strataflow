version: 2

sources:
  - name: public
    schema: public
    tables:

      - name: customers
        columns:
          - name: customer_id
            data_tests:
              - not_null
              - unique

      - name: products
        columns:
          - name: product_id
            data_tests:
              - not_null
              - unique
          - name: price
            data_tests:
              - not_null

      - name: orders
        columns:
          - name: order_id
            data_tests:
              - not_null
              - unique
          - name: customer_id
            data_tests:
              - not_null

      - name: order_items
        columns:
          - name: order_item_id
            data_tests:
              - not_null
              - unique
          - name: order_id
            data_tests:
              - not_null
          - name: product_id
            data_tests:
              - not_null

      - name: payments
        columns:
          - name: payment_id
            data_tests:
              - not_null
              - unique
          - name: order_id
            data_tests:
              - not_null